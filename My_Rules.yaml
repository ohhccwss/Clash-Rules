  - {name: Steam, type: select, proxies: [Proxies, DIRECT,🇭🇰 HK, 🇸🇬 SG, 🇯🇵 JP, 🇨🇳 TW, 🇺🇲 US], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Steam.png"}
  - {name: Ubisoft, type: select, proxies: [Proxies, DIRECT], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/UBISOFT.png"}
  - {name: Spotify, type: select, proxies: [Proxies, DIRECT, 🇭🇰 HK, 🇸🇬 SG, 🇯🇵 JP, 🇨🇳 TW, 🇺🇲 US], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Spotify.png"}
  - {name: Bilibili, type: select, proxies: [DIRECT, 🇨🇳 TW], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Bilibili.png"}
  - {name: Microsoft, type: select, proxies: [DIRECT,Proxies, 🇭🇰 HK, 🇸🇬 SG, 🇯🇵 JP, 🇨🇳 TW, 🇺🇲 US], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Microsoft.png"}
  - {name: OpenAI, type: select, proxies: [🇺🇲 US,Proxies], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/ChatGPT.png"}
  - {name: Anthropic, type: select, proxies: [🇺🇲 US,Proxies], include-all: true, icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Claude.png"}
  - {name: Game, type: select, proxies: [DIRECT, Proxies,🇭🇰 HK, 🇸🇬 SG, 🇯🇵 JP, 🇨🇳 TW, 🇺🇲 US], icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Game.png"}
  - {name: Direct, type: select, proxies: [DIRECT, Proxies],icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/DIRECT.png?"}
  - {name: Others, type: select, proxies: [Proxies, DIRECT],icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Other.png?"}
  - {name: 🇭🇰 HK, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(港|HK|香港|(?i)Hong))^((?!(台|日|韩|新|美)).)*$"}
  - {name: 🇸🇬 SG, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(新加坡|SG|坡|狮城|SG))^((?!(港|台|韩|日|美)).)*$" }
  - {name: 🇯🇵 JP, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(日|日本|JP|(?i)JP))^((?!(港|台|韩|新|美|尼)).)*$" }
  - {name: 🇨🇳 TW, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(台|台湾|TW|(?i)TW))^((?!(港|日|韩|新|美)).)*$"}
  - {name: 🇺🇲 US, type: url-test, include-all: true, use: [], tolerance: 20, interval: 300, filter: "(?=.*(美|美国|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"}

