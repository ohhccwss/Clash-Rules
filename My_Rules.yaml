proxy-providers:
  FlowerCloud:
    url: "订阅链接"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: DIRECT
    override:
      udp: true

# # 节点信息
# proxies:
#   - name: Direct-Out
#     type: direct

# 全局配置 
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true


# 域名嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true

  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

    TLS:
      ports: [443, 8443]

    QUIC:
      ports: [443, 8443]
      override-destination: true

  force-domain:
    - "cdn.platform.openai.com"
    - "+.chatgpt.com"
    - "+.openai.com"


# 入站  
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false

  # DNS 上游连接遵循分流规则
  respect-rules: true

  # 保留原来的 Fake-IP 配置
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-store: true
  fake-ip-store-path: ./fakeip.db

  prefer-h3: false
  use-hosts: true
  cache-algorithm: arc

  fake-ip-filter:
    - "rule-set:private_domain"
    - "rule-set:cn_domain"
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
    - "+.router"
    - "+.home"

  # 引导 DNS：用于解析 DNS 上游的域名
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6

  proxy-server-nameserver:
    - "tls://223.5.5.5#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"

  # 根据域名分配 DNS
  nameserver-policy:
    # 国内域名
    'geosite:cn':
      - https://dns.alidns.com/dns-query
      - https://dns.pub/dns-query

    # 国外域名
    'geosite:geolocation-!cn':
      - https://1.1.1.1/dns-query#Proxies
      - https://8.8.8.8/dns-query#Proxies

  # 直连出口所使用的 DNS
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://dns.pub/dns-query

  # 直连连接的 DNS 也遵循域名分类策略
  direct-nameserver-follow-policy: true

  # 默认 DNS：优先使用国外 DNS
  nameserver:
    - https://1.1.1.1/dns-query#Proxies
    - https://8.8.8.8/dns-query#Proxies

 

proxy-groups:
